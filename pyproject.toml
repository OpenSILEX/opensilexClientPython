[project]
name = "opensilex_python_client"
version = "2.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "rich>=14.3.4",
    "opensilexclienttoolspython @ git+https://github.com/OpenSILEX/opensilexClientToolsPython.git@1.5.0",

]

[tool.uv.build-backend]
source-include = ["data_examples/**"]
source-exclude = ["csv_example/**"]

description = "Python package for importing and managing variables in OpenSILEX"
readme = "README.md"
authors = [
    { name = "Gabriel Besombes", email = "gabriel.besombes@inrae.fr" },
    { name = "Arnaud Charleroy", email = "arnaud.charleroy@inrae.fr" },
    { name = "JEMAA Nouha", email = "nouha.jemaa@inrae.fr" },
] 

[project.scripts]
gen-doc = "pyscaf.documentation.scripts.parse_doc:gen_doc"
serve-doc = "pyscaf.documentation.scripts.parse_doc:serve_doc"
py-to-nb = "pyscaf.jupyter_tools.scripts.py_to_notebook:main"
exec-nb = "pyscaf.jupyter_tools.scripts.execute_notebook:main"
nb-to-html = "pyscaf.jupyter_tools.scripts.notebook_to_html:main"
py-to-nb-all = "pyscaf.jupyter_tools.scripts.main:py_to_nb_all"
exec-nb-all = "pyscaf.jupyter_tools.scripts.main:exec_nb_all"
nb-to-html-all = "pyscaf.jupyter_tools.scripts.main:nb_to_html_all"
download-variable-config-example = "opensilex_python_client.cli.download_variable_config_example:main"
run-variable-import = "opensilex_python_client.cli.import_variables:main"

[build-system]
requires = [
    "uv_build>=0.10.9,<0.11.0",
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc",
    "tomli",
    "jupyter",
    "notebook",
    "nbconvert",
    "ipykernel",
    "matplotlib",
    "pandas",
    "python-semantic-release>=9.21.1",
    "pytest",
    "pytest-cov",
    "jupytext",
    "ruff>=0.15.13",
]

[tool.pyscaf.documentation]
output_path = "docs"

[tool.pyscaf.jupyter_tools]
python_notebook_dir = "notebooks/python"
jupyter_notebook_dir = "notebooks/ipynb"
pdf_dir = "generated/pdfs"
html_dir = "generated/html"
hide_input = false
hide_output = false
template_name = "classic"
template_path = ""
template_file = ""

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/opensilex_python_client/__init__.py:__version__",
]
branch = "main"
upload_to_pypi = true
upload_to_release = true
upload_to_repository = true
assets = []
build_command_env = []
build_command = "pip install uv && uv build"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
changelog_sections = [
    "feature",
    "fix",
    "breaking",
]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "init"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = [
    "feat",
]
patch_tags = [
    "fix",
    "perf",
]
other_allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = false

[tool.semantic_release.remote]
name = "origin"
type = "gitlab"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = [
    "dist/*",
]
upload_to_vcs_release = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
src = [
    "src",
]
lint.select = [
    "B",
    "C4",
    "E",
    "F",
    "N",
    "W",
    "I",
    "UP",
]
line-length = 120
