# Configuration for OpenSILEX variable import
# URIs are auto-generated from names only

csv:
  # Map semantic roles to CSV columns.
  # Each value can be:
  #   - an integer (1-indexed column number)
  #   - a string (column header name)
  # If omitted, default column names are used (Entity_name, Characteristic_name, etc.)
  #
  # Required roles: entity_name, characteristic_name, method_name, unit_name,
  #                 variable_name, datatype_uri
  # Optional roles: variable_description, variable_alternative_name, time_interval,
  #                entity_definition, characteristic_definition, method_definition,
  #                entity_uri, characteristic_uri, method_uri, unit_uri
  column_mappings:
    entity_name: "Entity_name"
    characteristic_name: "Characteristic_name"
    method_name: "Method_name"
    unit_name: "Unit_name"
    variable_name: "Variable_name"
    datatype_uri: "Datatype_uri"
    variable_description: "Variable_description"
    variable_alternative_name: "Variable_alternative_name"
    time_interval: "Time_interval"
    entity_uri: "Entity_uri"
    characteristic_uri: "Characteristic_uri"
    method_uri: "Method_uri"
    unit_uri: "Unit_uri"

groups:
  # Map group name → CSV column (int index or string header name)
  group_mapping:
    "ExampleGroup": 9
    # "Environment": "Group1"
  
  # Mapping: Group name (in CSV) → Group URI (in OpenSILEX)
  available_groups:
    # "Phenotyping": "http://opensilex.test/id/variablesGroup/phenotyping"
    # "Environment": "http://opensilex.test/id/variablesGroup/environment"
    "ExampleGroup": "http://opensilex.test/id/variablesGroup/example"
  
  # Default group for variables without a group (optional)
  default_group: "http://opensilex.test/id/variablesGroup/example"