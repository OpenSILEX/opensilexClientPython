# Configuration for OpenSILEX variable import
# URIs are auto-generated from names only

csv:
  # REQUIRED columns in your CSV
  required_columns:
    - "Entity_name"           # Entity name (ex: Plant, Soil)
    - "Characteristic_name"   # Characteristic name (ex: Height, Temperature)
    - "Method_name"           # Method name (ex: Manual, Sensor)
    - "Unit_name"            # Unit name (ex: Centimeter, Celsius)
    - "Variable_name"        # Variable name (ex: Plant_Height_cm)
    - "Datatype_uri"         # Datatype URI
  
  # OPTIONAL columns in your CSV
  optional_columns:
    - "Variable_description"       # Variable description
    - "Variable_alternative_name"  # Alternative name
    - "Entity_Definition"          # Entity definition
    - "characteristic_definition"  # Characteristic definition
    - "Method_Definition"          # Method definition
    - "Time_interval"             # Time interval
    - "Group1"                    # First group membership
    - "Group2"                    # Second group membership

groups:
  # CSV columns containing group names
  group_columns:
    - "Group1"
    - "Group2"
  
  # Mapping: Group name (in CSV) → Group URI (in OpenSILEX)
  available_groups:
    "Phenotyping": "http://opensilex.test/id/variablesGroup/phenotyping"
    "Environment": "http://opensilex.test/id/variablesGroup/environment"
    "ExampleGroup": "http://opensilex.test/id/variablesGroup/example"
  
  # Default group for variables without Group1 or Group2 (optional)
  default_group: "http://opensilex.test/id/variablesGroup/default"
